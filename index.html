<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3eee5">
  <title>Fast Loop — Simple Fasting Timer</title>
  <meta name="description" content="Fast Loop is a simple fasting timer and wellness habit tracker.">
  <style>
    :root{color-scheme:light;--bg:#f3eee5;--ink:#292821;--muted:#777267}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100svh;display:grid;place-items:center;padding:32px 20px}.content{width:min(100%,680px);text-align:center}
    .mark{width:76px;height:76px;border:2px solid var(--ink);border-radius:50%;margin:0 auto 26px;display:grid;place-items:center;font-size:30px}
    h1{font-size:clamp(38px,8vw,58px);letter-spacing:-.05em;margin:0 0 6px}p{color:var(--muted);margin:8px 0 28px}
    nav{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:38px}a{color:var(--ink);text-underline-offset:4px}
    footer{margin-top:64px;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <main><div class="content">
    <div class="mark" aria-hidden="true">↻</div>
    <h1>Fast Loop</h1>
    <p>Simple Fasting Timer</p>
    <p>Your fast starts here.</p>
    <nav aria-label="Information">
      <a href="privacy.html">Privacy Policy</a>
      <a href="support.html">Support</a>
    </nav>
    <footer>© 2026 Fast Loop</footer>
  </div></main>
</body>
</html>
